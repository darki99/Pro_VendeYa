<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f5f5f5;
    }

    .register-container {
      margin-top: 5%;
    }

    .account-wall {
      background: #fff;
      padding: 40px 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }

    .profile-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      display: block;
      margin: 0 auto 20px;
    }

    .form-register input {
      margin-bottom: 15px;
    }

    .form-register .btn {
      background-color: #0d6efd;
      color: #fff;
    }

    .form-register .btn:hover {
      background-color: #0b5ed7;
    }

    .text-center.login-link {
      display: block;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="container register-container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <h1 class="text-center mb-4">Crea tu cuenta</h1>
        <div class="account-wall">
          <img class="profile-img" src="https://bootdey.com/img/Content/avatar/avatar1.png" alt="Avatar">

          <form class="form-register" method="POST" action="../../authdb/register.php">
            <input type="text" name="nombre" class="form-control" placeholder="Nombre completo" required>
            <input type="email" name="email" class="form-control" placeholder="Correo electrónico" required>
            <input type="password" name="password" class="form-control" placeholder="Contraseña (mínimo 8 caracteres)" required>

            <button class="btn btn-primary w-100" type="submit">Registrarse</button>

            <div class="text-center login-link">
              <a href="../html/login.html" class="text-decoration-none">¿Ya tienes cuenta? Inicia sesión</a>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>

</body>
</html>
