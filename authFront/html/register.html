<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .register-card {
      max-width: 450px;
      margin: auto;
      padding: 2rem;
      border-radius: 10px;
      background: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .btn-register {
      background-color: #66b3ff;
      color: white;
    }
    .btn-register:hover {
      background-color: #3399ff;
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

  <div class="register-card">
    <h4 class="text-center mb-4">Crear cuenta</h4>
    <form method="POST" action="../../authdb/register.php">
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" name="nombre" class="form-control" id="nombre" placeholder="Tu nombre completo" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Correo electrónico</label>
        <input type="email" name="email" class="form-control" id="email" placeholder="ejemplo@correo.com" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" name="password" class="form-control" id="password" placeholder="Mínimo 8 caracteres" required>
      </div>
      <button type="submit" class="btn btn-register w-100">Registrarse</button>
    </form>
  </div>

</body>
</html>
