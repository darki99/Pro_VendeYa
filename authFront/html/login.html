<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f5f5f5;
    }

    .login-container {
      margin-top: 5%;
    }

    .account-wall {
      background: #fff;
      padding: 40px 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }

    .profile-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      display: block;
      margin: 0 auto 20px;
    }

    .form-signin input {
      margin-bottom: 15px;
    }

    .form-signin .btn {
      background-color: #0d6efd;
      color: #fff;
    }

    .form-signin .btn:hover {
      background-color: #0b5ed7;
    }

    .text-center.new-account {
      display: block;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="container login-container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <h1 class="text-center mb-4">REGRESASTE!</h1>
        <div class="account-wall">
          <img class="profile-img" src="https://bootdey.com/img/Content/avatar/avatar7.png" alt="Avatar">

          <form class="form-signin" method="POST" action="/VendeYa/authdb/login.php">
            <input type="email" name="email" class="form-control" placeholder="Correo electrónico" required autofocus>
            <input type="password" name="password" class="form-control" placeholder="Contraseña" required>

            <button class="btn btn-primary w-100" type="submit">Iniciar sesión</button>

            <div class="d-flex justify-content-between mt-3">
              <div>
                <a href="#" class="text-decoration-none">¿Olvidaste tu contraseña?</a>
              </div>
              <div>
                <a href="../html/register.html" class="text-decoration-none">Regístrate</a>
              </div>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>

</body>
</html>
