<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .login-card {
      max-width: 400px;
      margin: auto;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      background: white;
    }
    .btn-login {
      background-color: #66b3ff;
      color: white;
    }
    .btn-login:hover {
      background-color: #3399ff;
    }
    .forgot-link {
      display: block;
      margin-top: 1rem;
      text-align: center;
      font-size: 0.9rem;
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

  <div class="login-card">
    <h4 class="text-center mb-4">¡Regresaste!</h4>
    <form method="POST" action="/VendeYa/authdb/login.php">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" name="email" class="form-control" id="email" placeholder="Email Usuario" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" name="password" class="form-control" id="password" placeholder="Password" required>
      </div>
      <button type="submit" class="btn btn-login w-100">Login</button>
      <a href="#" class="forgot-link text-primary">¿Has olvidado tu contraseña ?/ Cambiar contraseña.</a>
      <a href="../html/register.html">¿No tienes cuenta? Regístrate</a>
    </form>
  </div>

</body>
</html>
