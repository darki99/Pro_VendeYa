<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f2f2f2;
    }
    header {
      background: #232f3e;
      padding: 10px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav {
      background: #37475a;
      padding: 10px;
      color: white;
    }
    a {
      color: white;
      text-decoration: none;
      margin-left: 15px;
    }
    .sale .btn-sale {
      border-radius: 0;
      background-color: #69F0AE;
      box-shadow: 0px 10px 10px #E0E0E0;
      color: white;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }
    .card-custom {
      max-width: 300px;
      margin: 20px auto;
      box-shadow: 0 20px 40px rgba(0, 0, 0, .2);
      border-radius: 5px;
      padding-bottom: 10px;
      background: white;
      text-align: center;
    }
    .img-thumbnail {
      border: none;
      border-radius: 5px;
    }
    #ButtonPaybox {
      margin-top: 15px;
      display: none; /* Oculto por defecto */
    }
  </style>
</head>
<body>
  <header>
    <div>📦 VendeYa</div>
    <div>
      Bienvenido, {{nombre}} 
      <a href="/../VendeYa/dashboard/my-account/my-account.php">Mi perfil</a>
      <a href="/../VendeYa/authdb/logout.php">Cerrar sesión</a>
    </div>
  </header>

  <nav>
    <strong>Menú</strong> | Inicio | Productos | Categorías
  </nav>

  <div class="container">
    <div class="card card-custom">
      <div class="d-flex justify-content-end sale">
        <div class="btn-sale" onclick="mostrarBotonPago()">SALE</div>
      </div>
      <img class="mx-auto img-thumbnail" src="https://i.imgur.com/WaZxrEe.jpg" alt="Silla" width="auto" height="auto">
      <div class="card-body">
        <h5 class="card-title">Silla Moderna</h5>
        <p class="card-text">$99.00</p>
        <div id="ButtonPaybox"></div>
      </div>
    </div>
  </div>

<!-- SCRIPTS NECESARIOS -->
<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://sandbox-paybox.pagoplux.com/paybox/index.js"></script>
<script src="../Productos/paymentpagoplux/config.js"></script>
<script src="../Productos/paymentpagoplux/payment.js"></script>


  <script>
    function mostrarBotonPago() {
      const contenedor = document.getElementById("ButtonPaybox");
      contenedor.style.display = "block";
  
      // Este init debe ejecutarse después de mostrar el div
      payboxCheckout.init(data, "#ButtonPaybox", onAuthorize);
    }
  </script>
  
</body>
</html>
